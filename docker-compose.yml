services:
  app_proxy:
    environment:
      APP_HOST: soggy-miner-switchboard_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/soggyhammydev/soggy-miner-switchboard:0.1.0
    restart: on-failure
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - "3338:3338"
